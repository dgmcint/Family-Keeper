[package]
name = "family-keeper"
version = "0.1.4"
edition = "2024"
description = "A family history program for current macOS, Windows and Linux"
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
authors = ["Family Keeper contributors"]

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
encoding_rs = "0.8.44"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
open = "5.4.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"

# Puts the icon inside family-keeper.exe on Windows (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"

# Read by `cargo bundle --release`. Without an identifier the bundle gets an empty
# CFBundleIdentifier, and macOS crashes the app as soon as it opens a file dialog.
[package.metadata.bundle]
name = "Family Keeper"
identifier = "io.github.dgmcint.familykeeper"
category = "public.app-category.productivity"
short_description = "A family history program"
copyright = "Family Keeper contributors. Free for noncommercial use."
icon = ["assets/icon.icns"]
